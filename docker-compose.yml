services:
  api:
    build:
      context: .
      dockerfile: src/KeycloakOAuthApi/Dockerfile
    container_name: keycloak-oauth2-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
      - aspire-dashboard
    networks:
      - keycloak-oauth2

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak-oauth2-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-db
    networks:
      - keycloak-oauth2

  keycloak-db:
    image: postgres:17-alpine
    container_name: keycloak-oauth2-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-oauth2

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    container_name: keycloak-oauth2-aspire-dashboard
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
    networks:
      - keycloak-oauth2

networks:
  keycloak-oauth2:
    driver: bridge

volumes:
  keycloak-db-data:
